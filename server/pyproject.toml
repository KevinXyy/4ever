[project]
name = "gemma-local-server"
version = "0.1.0"
requires-python = "==3.12.9"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.10.5",
  "structlog==24.4.0",
  "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.8.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
