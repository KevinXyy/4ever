name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flutter:
    name: Flutter
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.8"

      - name: Setup Python
        run: uv python install 3.12.9

      - name: Install dependencies
        run: |
          uv venv --python 3.12.9
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Ruff
        run: .venv/bin/ruff check app tests --no-cache

      - name: Mypy
        run: .venv/bin/mypy app

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/server
        run: .venv/bin/pytest
